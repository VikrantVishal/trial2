<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light only" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quiz – Digital SOP Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700&family=Saira+Extra+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="quiz.css" />
    <style>
      /* Apply Saira Condensed only to body content and quiz modals */
      #app,
      #app button,
      #app input,
      #app select,
      #app textarea,
      .qz-ov,
      .qz-ov button,
      .qz-ov input,
      .qz-ov select,
      .qz-ov textarea {
        font-family: "Saira Condensed", "Mukta", "Noto Sans Devanagari", Arial, sans-serif;
      }

      /* Scale down font sizes slightly across quiz elements */
      #app {
        font-size: 0.95rem;
      }
      #app .qz-q {
        font-size: 1.12rem;
      }
      #app .qz-opt {
        font-size: 1.02rem;
      }
      #app .qz-btn {
        font-size: 1rem;
      }
      #app .qz input[type="text"],
      #app .qz select {
        font-size: 1rem;
      }
      #app .qz label.f {
        font-size: 0.95rem;
      }
      #app .qz-qc .top {
        font-size: 1.05rem;
      }
      #app .qz-hero h2 {
        font-size: 1.6rem;
      }
      #app .qz-score {
        font-size: 1.9rem;
      }
      #app .qz-stats b {
        font-size: 1.4rem;
      }

      /* Preserve original font and size for the Hindi/English language toggle bar */
      #app .qz-langbar,
      #app .qz-langbar .lang,
      #app .qz-langbar .lang button {
        font-family: var(--font) !important;
        font-size: 0.8rem;
      }

      /* Saira Extra Condensed: ONLY Reattempt, View Results, Enter Quiz (tile + popup) and Go Back (font-family + slightly smaller size) */
      #app .qz-qc > button.block[data-start]:not(.ok),
      #app .qz-qc button.ghost[data-start],
      #app .qz-qc button[data-view],
      #app button[data-act="closeModal"],
      #app #bStart,
      .qz-ov button[data-act="closeModal"],
      .qz-ov #bStart {
        font-family: "Saira Extra Condensed", "Mukta", "Noto Sans Devanagari", Arial, sans-serif;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="js/departments.js"></script>
    <script src="js/app.js"></script>
    <script src="js/quiz-sample.js"></script>
    <script type="module" src="js/quiz.js"></script>
  </body>
</html>
