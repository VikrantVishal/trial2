<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light only" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quiz Admin – Digital SOP Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="quiz.css" />
    <style>
      /* Apply Saira Condensed ONLY to quiz-admin content (#app, modals, toasts), leaving header/footer untouched */
      #app,
      #app button,
      #app input,
      #app select,
      #app textarea,
      .qz-ov,
      .qz-ov button,
      .qz-ov input,
      .qz-ov select,
      .qz-ov textarea,
      .qz-info,
      .qz-err {
        font-family: "Saira Condensed", "Mukta", "Noto Sans Devanagari", Arial, sans-serif;
      }

      main { max-width: 1000px; }
      .qz { max-width: none; }
      .tabs { display: flex; gap: 6px; flex-wrap: nowrap; margin: 8px 0 12px; padding-bottom: 4px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: thin; overscroll-behavior-x: contain; }
      .tabs button { flex: none; white-space: nowrap; }
      .qz-btn.on { background: var(--blue1); }
      .tbl { width: 100%; border-collapse: collapse; font-size: .95rem; background: #fff; }
      .tbl th, .tbl td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--bd); }
      .tbl th { color: var(--blue1); background: var(--card); position: sticky; top: 0; }
      .scroll { max-height: 55vh; overflow: auto; border: 1px solid var(--bd); border-radius: 8px; }
      .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
      .kpi div { padding: 12px; background: var(--card); border: 1px solid var(--bd); border-radius: 10px; }
      .kpi b { display: block; font-size: 1.9rem; color: var(--blue1); }
      .qz textarea { width: 100%; min-height: 70px; padding: 8px; font: inherit; border: 2px solid var(--bd); border-radius: 8px; }
      .qz input[type="email"], .qz input[type="password"], .qz input[type="date"], .qz input[type="number"] { width: 100%; min-height: 44px; padding: 6px 10px; font: inherit; border: 2px solid var(--bd); border-radius: 8px; }
      .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      @media (max-width: 600px) { .f2 { grid-template-columns: 1fr; } }
      .q-adm { margin-bottom: 10px; padding: 10px; background: #fff; border: 2px solid var(--bd); border-left: 6px solid var(--warn); border-radius: 10px; line-height: 1.4; }
      .q-adm.approved { border-left-color: var(--ok); }
      .q-adm.rejected { border-left-color: var(--bad); opacity: .75; }
      .q-adm .o.r { background: #dcfce7; border-radius: 4px; }
      .q-adm .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

      /* lighter font weight + thinner borders (content area only; header/footer untouched) */
      .qz, .qz p, .qz td, .qz div { font-weight: 400; }
      .qz h2, .qz h3 { font-weight: 500; }
      .qz label.f { font-weight: 500; }
      .qz .qz-btn, .qz .badge { font-weight: 500; }
      .qz .qz-btn { border-width: 1px; }
      .qz .tbl th { font-weight: 500; }
      .qz b, .qz strong { font-weight: 500; }
      .qz .kpi b { font-weight: 500; }
      .qz .qz-card, .qz .q-adm, .qz .kpi div { border-width: 1px; border-left-width: 4px; }
      .qz .qz-card.plain { border-left-width: 1px; }
      .qz input[type="text"], .qz input[type="email"], .qz input[type="password"], .qz input[type="date"], .qz input[type="number"], .qz select, .qz textarea { border-width: 1px; }
      .qz .kpi div { border-left-width: 1px; }
      .scroll { border-width: 1px; }

      /* Password card only: full width, label left / input right on wide screens, stacked on mobile */
      .qz .pw-card { max-width: none; width: 100%; }
      .qz .pw-card .pw-row { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; align-items: center; gap: 6px 16px; margin: 10px 0; }
      .qz .pw-card .pw-row label.f { margin: 0; }
      .qz .pw-card .pw-row input { width: 100%; min-width: 0; }
      @media (max-width: 600px) { .qz .pw-card .pw-row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main id="app"><div class="qz" id="root"></div></main>
    <script src="js/departments.js"></script>
    <script src="js/app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module" src="js/quiz-admin.js?v=4"></script>
  </body>
</html>
