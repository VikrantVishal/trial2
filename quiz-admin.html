<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light only" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Quiz Admin – Digital SOP Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="quiz.css" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link
      rel="preconnect"
      href="https://firestore.googleapis.com"
      crossorigin
    />
    <link
      rel="modulepreload"
      href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
    />
    <link
      rel="modulepreload"
      href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    />
    <link rel="modulepreload" href="js/quiz-firebase.js" />
    <style>
      .qz,
      .qz *,
      .qz *::before,
      .qz *::after {
        box-sizing: border-box;
      }
      /* Apply Saira Condensed ONLY to quiz-admin content (#app, modals, toasts), leaving header/footer untouched */
      #app,
      #app button,
      #app input,
      #app select,
      #app textarea,
      .qz-ov,
      .qz-ov button,
      .qz-ov input,
      .qz-ov select,
      .qz-ov textarea,
      .qz-info,
      .qz-err {
        font-family:
          "Saira Condensed", "Mukta", "Noto Sans Devanagari", Arial, sans-serif;
      }

      main {
        max-width: 1000px;
      }
      .qz {
        max-width: none;
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: nowrap;
        margin: 8px 0 12px;
        padding-bottom: 4px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        overscroll-behavior-x: contain;
      }
      .tabs button {
        flex: none;
        white-space: nowrap;
      }
      .qz-btn.on {
        background: var(--blue1);
      }
      .tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
        background: #fff;
      }
      .tbl th,
      .tbl td {
        padding: 6px 8px;
        text-align: left;
        border-bottom: 1px solid var(--bd);
      }
      .tbl th {
        color: var(--blue1);
        background: var(--card);
        position: sticky;
        top: 0;
      }
      .scroll {
        max-height: 55vh;
        overflow: auto;
        border: 1px solid var(--bd);
        border-radius: 8px;
      }
      .kpi {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .kpi div {
        padding: 12px;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
      }
      .kpi b {
        display: block;
        font-size: 1.9rem;
        color: var(--blue1);
      }
      .qz textarea {
        width: 100%;
        min-height: 70px;
        padding: 8px;
        font: inherit;
        border: 2px solid var(--bd);
        border-radius: 8px;
      }
      .qz input[type="email"],
      .qz input[type="password"],
      .qz input[type="date"],
      .qz input[type="number"] {
        box-sizing: border-box;
        width: 100%;
        min-height: 44px;
        padding: 6px 10px;
        font: inherit;
        border: 2px solid var(--bd);
        border-radius: 8px;
      }
      .f2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        min-width: 0;
      }
      .f2 > div {
        min-width: 0;
      }
      /* Normalize date inputs to match <select> exactly across iOS and Android */
      .qz input[type="date"],
      #gF,
      #gE {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background-color: #fff !important;
        background-image: none !important;
        box-sizing: border-box !important;
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        min-height: 44px;
        padding: 6px 12px !important;
        margin: 0 !important;
        border: 1px solid var(--bd) !important;
        border-radius: 8px !important;
        color: inherit;
        font: inherit;
        line-height: normal;
      }

      /* Fix iOS text alignment and prevent internal clipping */
      .qz input[type="date"]::-webkit-date-and-time-value {
        text-align: left !important;
        margin: 0 !important;
        padding: 0 !important;
        min-height: 1.2em;
      }

      /* Ensure inner WebKit container respects box sizing */
      .qz input[type="date"]::-webkit-datetime-edit {
        display: inline-flex;
        min-width: 0;
        max-width: 100%;
        padding: 0;
      }

      /* 3. Protect all card wrappers and form rows from expanding */
      .qz .qz-card,
      .qz form,
      .f2,
      .f2 > div {
        max-width: 100% !important;
        box-sizing: border-box !important;
        overflow: hidden;
      }
      @media (max-width: 600px) {
        .f2 {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .q-adm {
        margin-bottom: 10px;
        padding: 10px;
        background: #fff;
        border: 2px solid var(--bd);
        border-left: 6px solid var(--warn);
        border-radius: 10px;
        line-height: 1.4;
      }
      .q-adm.approved {
        border-left-color: var(--ok);
      }
      .q-adm.rejected {
        border-left-color: var(--bad);
        opacity: 0.75;
      }
      .q-adm .o.r {
        background: #dcfce7;
        border-radius: 4px;
      }
      .q-adm .acts {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      /* lighter font weight + thinner borders (content area only; header/footer untouched) */
      .qz,
      .qz p,
      .qz td,
      .qz div {
        font-weight: 400;
      }
      .qz h2,
      .qz h3 {
        font-weight: 500;
      }
      .qz label.f {
        font-weight: 500;
      }
      .qz .qz-btn,
      .qz .badge {
        font-weight: 500;
      }
      .qz .qz-btn {
        border-width: 1px;
      }
      .qz .tbl th {
        font-weight: 500;
      }
      .qz b,
      .qz strong {
        font-weight: 500;
      }
      .qz .kpi b {
        font-weight: 500;
      }
      .qz .qz-card,
      .qz .q-adm,
      .qz .kpi div {
        border-width: 1px;
        border-left-width: 4px;
      }
      .qz .qz-card.plain {
        border-left-width: 1px;
      }
      .qz input[type="text"],
      .qz input[type="email"],
      .qz input[type="password"],
      .qz input[type="date"],
      .qz input[type="number"],
      .qz select,
      .qz textarea {
        border-width: 1px;
      }
      .qz .kpi div {
        border-left-width: 1px;
      }
      .scroll {
        border-width: 1px;
      }

      /* Password card only: full width, label left / input right on wide screens, stacked on mobile */
      .qz .pw-card {
        max-width: none;
        width: 100%;
      }
      .qz .pw-card .pw-row {
        display: grid;
        grid-template-columns: minmax(220px, 300px) 1fr;
        align-items: center;
        gap: 6px 16px;
        margin: 10px 0;
      }
      .qz .pw-card .pw-row label.f {
        margin: 0;
      }
      .qz .pw-card .pw-row input {
        width: 100%;
        min-width: 0;
      }
      @media (max-width: 600px) {
        .qz .pw-card .pw-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"><div class="qz" id="root"></div></main>
    <script src="js/departments.js"></script>
    <script src="js/app.js"></script>
    <script type="module" src="js/quiz-admin.js?v=4"></script>
  </body>
</html>
